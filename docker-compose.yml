services:
  db:
    image: postgres:16-alpine
    container_name: masterflow_postgres
    restart: always
    environment:
      POSTGRES_DB: masterflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: