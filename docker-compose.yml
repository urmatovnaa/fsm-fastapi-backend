services:
  db:
    image: postgres:16-alpine
    container_name: masterflow_postgres
    restart: always
    environment:
      POSTGRES_DB: masterflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      # Наружу порт 5433 (чтобы не конфликтовать с локальным postgres).
      # Внутри docker compose приложение обращается к db:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d masterflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: